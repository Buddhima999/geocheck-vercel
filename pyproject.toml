[project]
name = "geocheck"
version = "0.1.0"
description = "GeoCheck - CSV QC tool for fiber ISP field engineers (FastAPI + MongoDB)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pymongo==4.18.2",
    "shapely==2.1.2",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
]

# Vercel loads the existing FastAPI app from backend/main.py.
[tool.vercel]
entrypoint = "backend.main:app"